name: Build Aaron's Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja and Python deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-pip --allow-unauthenticated

      - name: Apply Aaron's mods
        run: bash apply_aaron_mods.sh

      - name: Configure (dbt downloads toolchain automatically)
        run: python3 dbt.py configure

      - name: Build
        run: python3 dbt.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: deluge-aaron-firmware
          path: build/**/*.bin
