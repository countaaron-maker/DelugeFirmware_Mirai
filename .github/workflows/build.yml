name: Build Aaron's Firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build --allow-unauthenticated
      - name: Apply Aaron's mods
        run: bash apply_aaron_mods.sh
      - name: Build release firmware
        run: python3 dbt.py exec -- python3 dbt.py build release
      - name: Find firmware files
        run: find . -not -path './.git/*' -not -path './toolchain/*' \( -name '*.bin' -o -name '*.elf' \)
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: deluge-aaron-firmware
          path: "**/*.bin"
